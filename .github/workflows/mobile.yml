name: Сборка телефона

on:
  push:
    branches: [main]
    paths:
      - "prep_app/app/**"
      - "prep_app/scripts/build_mobile.sh"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "prep_app/app/**"
      - "prep_app/scripts/build_mobile.sh"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      api_base:
        description: "Адрес сервера внутри приложения, например http://192.168.1.10:8080"
        required: false
        type: string
      ios_bundle_id:
        description: "Bundle ID iOS. Нужен, если в профиле маска, и должен совпадать с профилем"
        required: false
        type: string
      ios_export_method:
        description: "Метод экспорта подписанного IPA"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - development
          - ad-hoc
          - app-store
          - enterprise

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Зависимости
        working-directory: prep_app/app
        run: flutter pub get

      - name: flutter test
        working-directory: prep_app/app
        run: flutter test

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Лицензии Android
        run: timeout 120s bash -c 'yes | flutter doctor --android-licenses' || true

      - name: Собрать APK
        env:
          API_BASE: ${{ github.event.inputs.api_base || vars.API_BASE || 'http://127.0.0.1:8080' }}
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./prep_app/scripts/build_mobile.sh android

      - name: Итог
        if: always()
        run: |
          if [[ -f prep_app/app/build/mobile-out/android-build-info.txt ]]; then
            {
              echo "### Android"
              echo
              echo '```text'
              cat prep_app/app/build/mobile-out/android-build-info.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: prep-app-android-${{ github.run_number }}
          path: prep_app/app/build/mobile-out/*
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS IPA
    needs: test
    # Flutter 3.47 собирается текущим Xcode. Образ xcode-27 — отдельный
    # GitHub-hosted runner, не macos-latest.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Xcode
        run: xcodebuild -version

      - name: Собрать IPA
        env:
          API_BASE: ${{ github.event.inputs.api_base || vars.API_BASE || 'http://127.0.0.1:8080' }}
          BUILD_NUMBER: ${{ github.run_number }}
          IOS_BUNDLE_ID: ${{ github.event.inputs.ios_bundle_id || vars.IOS_BUNDLE_ID || '' }}
          IOS_EXPORT_METHOD: ${{ github.event.inputs.ios_export_method || 'auto' }}
          IOS_CERTIFICATE_BASE64: ${{ github.event_name != 'pull_request' && secrets.IOS_CERTIFICATE_BASE64 || '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ github.event_name != 'pull_request' && secrets.IOS_PROVISIONING_PROFILE_BASE64 || '' }}
        run: ./prep_app/scripts/build_mobile.sh ios

      - name: Итог
        if: always()
        run: |
          if [[ -f prep_app/app/build/mobile-out/ios-build-info.txt ]]; then
            {
              echo "### iOS"
              echo
              echo '```text'
              cat prep_app/app/build/mobile-out/ios-build-info.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Артефакт IPA
        uses: actions/upload-artifact@v4
        with:
          name: prep-app-ios-${{ github.run_number }}
          path: prep_app/app/build/mobile-out/*
          if-no-files-found: error
          retention-days: 30
